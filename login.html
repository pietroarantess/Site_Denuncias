
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Security Woman</title>

    <link rel="stylesheet" href="/css/login.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Crimson+Text&display=swap" rel="stylesheet">

</head>

<body>

    <!-- HEADER -->

    <header class="header">

        <a href="/" class="logo" aria-label="Security Woman - Página inicial">
            <span>SECURITY</span>
            <span>WOMAN</span>
        </a>

        <nav class="navigation" aria-label="Navegação principal">

            <a href="/">Início</a>
            <a href="/denuncia">Denúncia</a>
            <a href="/contatos">Contatos</a>
            <a href="/saiba-mais">Saiba Mais</a>

        </nav>

        <a href="/login" class="login-button" aria-current="page">
            Login <span>›</span>
        </a>

    </header>


    <!-- CONTEÚDO PRINCIPAL -->

    <main class="main-container" id="inicio">

        <!-- TÍTULO -->

        <div class="page-title">

            <h1>Login</h1>

            <p>
                Sua segurança vem em primeiro lugar!
            </p>

        </div>


        <!-- CARD DE LOGIN -->

        <div class="login-card" id="login-card">

            <!-- ALERTA -->

            <div
                id="alert-message"
                class="alert"
                role="alert"
                aria-live="polite"
                hidden
            ></div>


            <!-- FORMULÁRIO -->

            <form id="login-form">

                <!-- E-MAIL -->

                <div class="form-group">

                    <label for="login-email">
                        E-mail
                    </label>

                    <div class="input-container">

                        <span class="input-icon" aria-hidden="true">

                            <svg viewBox="0 0 24 24" fill="none">
                                <rect x="3" y="5" width="18" height="14" rx="2"
                                    stroke="currentColor" stroke-width="1.8"/>
                                <path d="M3 7L12 13L21 7"
                                    stroke="currentColor" stroke-width="1.8"
                                    stroke-linecap="round"/>
                            </svg>

                        </span>

                        <input
                            type="email"
                            id="login-email"
                            name="email"
                            autocomplete="email"
                            placeholder="Digite seu e-mail"
                            required
                        >

                    </div>

                </div>


                <!-- SENHA -->

                <div class="form-group">

                    <label for="login-password">
                        Senha
                    </label>

                    <div class="input-container">

                        <span class="input-icon" aria-hidden="true">

                            <svg viewBox="0 0 24 24" fill="none">
                                <rect x="4" y="10" width="16" height="11" rx="2"
                                    stroke="currentColor" stroke-width="1.8"/>
                                <path d="M8 10V7a4 4 0 0 1 8 0v3"
                                    stroke="currentColor" stroke-width="1.8"
                                    stroke-linecap="round"/>
                            </svg>

                        </span>

                        <input
                            type="password"
                            id="login-password"
                            name="password"
                            autocomplete="current-password"
                            placeholder="Digite sua senha"
                            required
                        >

                        <!-- MOSTRAR / OCULTAR SENHA -->

                        <button
                            type="button"
                            id="toggle-password"
                            class="toggle-password"
                            aria-label="Mostrar senha"
                            title="Mostrar senha"
                        >

                            <svg id="eye-icon" viewBox="0 0 24 24" fill="none">

                                <path
                                    d="M2 12C2 12 5.5 5 12 5S22 12 22 12
                                    S18.5 19 12 19S2 12 2 12Z"
                                    stroke="currentColor"
                                    stroke-width="1.8"
                                    stroke-linejoin="round"
                                />

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="3"
                                    stroke="currentColor"
                                    stroke-width="1.8"
                                />

                            </svg>

                        </button>

                    </div>

                </div>


                <!-- BOTÃO ENTRAR -->

                <button type="submit" class="submit-button">

                    <span>Entrar</span>

                    <svg viewBox="0 0 24 24" fill="none">

                        <path
                            d="M5 12H19M12 5L19 12L12 19"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />

                    </svg>

                </button>

            </form>

        </div>


        <!-- CONTATO / APOIO -->

        <div class="contact-card" id="contatos">

            <p>
                Precisa de apoio imediato? Ligue para a Central
                de Atendimento à Mulher:

                <strong>180</strong>
            </p>

        </div>

    </main>


    <script src="/js/login.js"></script>

</body>

</html>
